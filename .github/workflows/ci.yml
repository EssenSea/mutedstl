name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Vim ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Minimum supported line: Vim 9.1 (the current stable in major
          # distributions, e.g. Gentoo 9.1.1652).  Tested on the distro Vim.
          - name: minimum (9.1, ubuntu-24.04)
            os: ubuntu-24.04
            install: apt
          # Newest official release, to catch forward-compatibility issues.
          - name: latest (official AppImage)
            os: ubuntu-latest
            install: appimage
    steps:
      - uses: actions/checkout@v4

      - name: Install Vim (apt)
        if: matrix.install == 'apt'
        run: |
          sudo apt-get update
          # vim-nox is a full build (vim9script, +eval, complete runtime);
          # fall back to 'vim' if unavailable.
          sudo apt-get install -y vim-nox || sudo apt-get install -y vim
          vim --version | head -1

      - name: Install Vim (latest official AppImage)
        if: matrix.install == 'appimage'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/vim/vim-appimage/releases/latest"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
               -H "Accept: application/vnd.github+json" "$api" -o release.json
          tag=$(python3 -c 'import json;print(json.load(open("release.json"))["tag_name"])')
          url=$(python3 -c 'import json;d=json.load(open("release.json"));print(next(a["browser_download_url"] for a in d["assets"] if a["name"].startswith("Vim-") and a["name"].endswith(".AppImage") and "x86_64" in a["name"]))')
          echo "Resolved Vim $tag -> $url"
          test -n "$url"
          curl -fLo vim.appimage "$url"
          chmod +x vim.appimage
          # Extract instead of running in place: no FUSE needed on the runner.
          ./vim.appimage --appimage-extract >/dev/null
          echo "VIM=$(pwd)/squashfs-root/AppRun" >> "$GITHUB_ENV"

      - name: Show Vim features
        run: |
          vim_bin="${VIM:-vim}"
          "$vim_bin" --version | head -1
          "$vim_bin" --version | grep -oE '[+-]vim9script' || true
          "$vim_bin" --version | grep -oE '[+-]eval' || true
          # -es swallows :echo, so write the probe results to a file.
          "$vim_bin" -es -N -u NONE \
            -c 'call writefile(["hlget=" .. exists("*hlget")], "probe.txt")' \
            -c 'call writefile(["hlset=" .. exists("*hlset")], "probe.txt", "a")' \
            -c 'colorscheme blue' \
            -c 'call writefile(["colors_name=" .. get(g:, "colors_name", "<unset>")], "probe.txt", "a")' \
            -c 'call writefile(["colornames=" .. len(v:colornames)], "probe.txt", "a")' \
            -c 'qall!' 2>/dev/null || true
          cat probe.txt 2>/dev/null || true

      - name: Run test suite
        run: VIM="${VIM:-vim}" test/run.sh

  lint:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y vim shellcheck

      - name: shellcheck
        run: shellcheck test/run.sh

      - name: help tags are up to date
        run: make docs-check

      - name: Real-terminal render check
        run: |
          # pyte renders the PTY stream to a screen buffer; install it in a
          # throwaway venv so we do not depend on a writable ~/.local.
          python3 -m venv /tmp/ptenv
          /tmp/ptenv/bin/pip install --quiet pyte
          /tmp/ptenv/bin/python test/term_render.py
